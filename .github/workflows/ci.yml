name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rlaas/api exec prisma generate

      - name: Build shared packages
        run: |
          pnpm --filter @rlaas/shared-types build
          pnpm --filter @rlaas/express-sdk build

      - name: Build api and dashboard
        run: |
          pnpm --filter @rlaas/api build
          pnpm --filter @rlaas/dashboard build

      - name: Run api tests
        run: pnpm --filter @rlaas/api test -- --runInBand
