name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege, stated rather than inherited. Without this the job runs with
# whatever the repository default grants, which on older repositories is
# contents: write - enough for a compromised action to push to main.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      # The characterization suite deliberately does NOT mock Redis — TTL, key
      # layout and Lua atomicity are the behaviours it records. It talks to
      # database index 15 and refuses to start unless that index is empty,
      # which a fresh container guarantees.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # SHA-pinned, not @v4: a mutable tag on a third-party action means the
        # code that runs here can change without a commit in this repository.
        # b906aff is the commit v4 pointed at when this was pinned.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rlaas/backend exec prisma generate

      - name: Build shared packages
        run: |
          pnpm --filter @rlaas/shared-types build
          pnpm --filter @rlaas/express-sdk build

      - name: Build backend and frontend
        run: |
          pnpm --filter @rlaas/backend build
          pnpm --filter @rlaas/frontend build

      - name: Run backend unit tests
        run: pnpm --filter @rlaas/backend test:unit

      - name: Run backend characterization tests
        run: pnpm --filter @rlaas/backend test:characterization
        env:
          CHARACTERIZATION_REDIS_URL: redis://127.0.0.1:6379/15
